name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Render widget contact sheet
        continue-on-error: true
        run: |
          gradle testDebugUnitTest --tests "com.phani.widgets.RenderSheetTest" --tests "com.phani.widgets.ScreensTest" --tests "com.phani.widgets.QuickTest" --no-daemon 2>&1 | grep -E "FAIL|Exception|Error|at com.phani|BUILD|tests completed" | head -40
          ls -la app/build/sheet.png app/build/screens.png || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            if grep -q '<failure' "$f"; then
              echo "::error::T: $(basename $f) $(sed -n '/<failure/,/<\/failure>/p' "$f" | grep -E 'failure message|Exception|Error|at com\.phani|Caused by' | head -14 | tr '\n' ' ' | cut -c1-3000)"
            fi
          done

      - name: Publish latest release (replaces older builds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk widget-app.apk
          gh release delete latest --yes --cleanup-tag || true
          EXTRA=""; [ -f app/build/sheet.png ] && cp app/build/sheet.png sheet.png && EXTRA="sheet.png"
          [ -f app/build/screens.png ] && cp app/build/screens.png screens.png && EXTRA="$EXTRA screens.png"
          [ -f app/build/quick.png ] && cp app/build/quick.png quick.png && EXTRA="$EXTRA quick.png"
          [ -f app/build/sig.png ] && cp app/build/sig.png sig.png && EXTRA="$EXTRA sig.png"
          [ -f app/build/sig2.png ] && cp app/build/sig2.png sig2.png && EXTRA="$EXTRA sig2.png"
          [ -f app/build/tall.png ] && cp app/build/tall.png tall.png && EXTRA="$EXTRA tall.png"
          [ -f app/build/drops.png ] && cp app/build/drops.png drops.png && EXTRA="$EXTRA drops.png"
          gh release create latest widget-app.apk $EXTRA \
            --title "Latest build" \
            --notes "Build from commit ${GITHUB_SHA::7}" \
            --latest
